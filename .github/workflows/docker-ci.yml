name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 이미지 pull
      - name: Pull backend image
        run: docker pull limseongin/paw-backend:3.0

      - name: Pull frontend image
        run: docker pull limseongin/paw-frontend:2.0

      # 3. 네트워크 생성
      - name: Create network
        run: docker network create app-network || true

      # 4. MongoDB 실행
      - name: Run MongoDB
        run: |
          docker run -d \
            --name mongo \
            --network app-network \
            -p 27017:27017 \
            mongo:7

      # 5. MongoDB 준비 대기 (핵심)
      - name: Wait for MongoDB
        run: |
          for i in {1..20}; do
            docker exec mongo mongosh --eval "db.runCommand({ ping: 1 })" && exit 0
            echo "mongo not ready yet... retry $i"
            sleep 2
          done
          echo "mongo failed"
          exit 1

      # 6. Backend 실행
      - name: Run backend container
        run: |
          docker run -d \
            --name backend \
            --network app-network \
            -p 8000:8000 \
            -e MONGO_HOST=mongo \
            -e MONGO_PORT=27017 \
            -e MONGO_DB=pet_data \
            limseongin/paw-backend:3.0

      # 7. Backend 로그 먼저 확인 (중요)
      - name: Backend logs (debug)
        run: |
          sleep 5
          docker logs backend

      # 8. Backend 대기 (curl 이전에 안정화)
      - name: Wait backend startup
        run: |
          for i in {1..30}; do
            curl -s http://localhost:8000/api/facilities && exit 0
            echo "backend not ready yet... retry $i"
            sleep 3
          done
          echo "backend failed"
          docker logs backend
          exit 1

      # 9. Frontend 실행
      - name: Run frontend container
        run: |
          docker run -d \
            --name frontend \
            -p 8080:80 \
            limseongin/paw-frontend:2.0

      # 10. Frontend 확인
      - name: Frontend check
        run: |
          for i in {1..20}; do
            curl -s http://localhost:8080 && exit 0
            echo "frontend not ready yet... retry $i"
            sleep 3
          done
          echo "frontend failed"
          exit 1

      # 11. 상태 확인
      - name: Docker status
        run: docker ps -a

      # 12. 정리
      - name: Cleanup
        if: always()
        run: |
          docker stop backend frontend mongo || true
          docker rm backend frontend mongo || true
          docker network rm app-network || true
