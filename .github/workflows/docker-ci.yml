name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 이미지 pull
      - name: Pull backend image
        run: docker pull limseongin/paw-backend:3.0

      - name: Pull frontend image
        run: docker pull limseongin/paw-frontend:2.0

      # 3. 컨테이너 실행
      - name: Run backend container
        run: |
          docker run -d --name backend -p 3000:3000 limseongin/paw-backend:3.0

      - name: Run frontend container
        run: |
          docker run -d --name frontend -p 8080:80 limseongin/paw-frontend:2.0

      # 4. 컨테이너 상태 먼저 확인 (중요)
      - name: Check container status
        run: docker ps -a

      # 5. 로그 먼저 확인 (진짜 핵심)
      - name: Backend logs
        run: docker logs backend || true

      - name: Frontend logs
        run: docker logs frontend || true

      # 6. 서버 뜨는 시간 확보
      - name: Wait for services
        run: sleep 10

      # 7. backend 헬스체크 (retry + timeout 보호)
      - name: Test backend health (retry)
        run: |
          for i in {1..15}; do
            curl -f http://localhost:3000 && exit 0
            echo "backend not ready yet... retry $i"
            sleep 3
          done
          echo "backend failed"
          exit 1

      # 8. frontend 헬스체크
      - name: Test frontend health (retry)
        run: |
          for i in {1..15}; do
            curl -f http://localhost:8080 && exit 0
            echo "frontend not ready yet... retry $i"
            sleep 3
          done
          echo "frontend failed"
          exit 1

      # 9. 실패해도 무조건 정리
      - name: Stop containers
        if: always()
        run: |
          docker stop backend frontend || true
          docker rm backend frontend || true
