name: CI-CD Docker Swarm Deploy

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    tags:
      - 'v*.*.*'

env:
  REGISTRY: 192.168.0.215
  PROJECT: pawdata

jobs:
  build-push:
    runs-on: self-hosted
    outputs:
      backend_image: ${{ steps.vars.outputs.backend_image }}
      frontend_image: ${{ steps.vars.outputs.frontend_image }}
      deploy_tag: ${{ steps.vars.outputs.deploy_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure insecure Harbor registry
        run: |
          if ! grep -q "${REGISTRY}" /etc/docker/daemon.json 2>/dev/null; then
            echo "{
              \"insecure-registries\": [\"${REGISTRY}\"]
            }" | sudo tee /etc/docker/daemon.json
            sudo systemctl restart docker
          fi
          until docker info >/dev/null 2>&1; do sleep 1; done

      - name: Set branch/tag variables
        id: vars
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          RUN_NO="${GITHUB_RUN_NUMBER}"
          REF_NAME="${GITHUB_REF_NAME}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            DEPLOY_TAG="${REF_NAME}"
          elif [[ "${REF_NAME}" == "main" ]]; then
            DEPLOY_TAG="main-${SHORT_SHA}-${RUN_NO}"
          elif [[ "${REF_NAME}" == "develop" ]]; then
            DEPLOY_TAG="develop-${SHORT_SHA}-${RUN_NO}"
          else
            SAFE_BRANCH=$(echo "${REF_NAME}" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]')
            DEPLOY_TAG="${SAFE_BRANCH}-${SHORT_SHA}-${RUN_NO}"
          fi

          echo "deploy_tag=${DEPLOY_TAG}" >> $GITHUB_OUTPUT
          echo "backend_image=${REGISTRY}/${PROJECT}/backend" >> $GITHUB_OUTPUT
          echo "frontend_image=${REGISTRY}/${PROJECT}/frontend" >> $GITHUB_OUTPUT

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Docker meta backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.backend_image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.vars.outputs.deploy_tag }}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.deploy_tag }}

      - name: Docker meta frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.frontend_image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.vars.outputs.deploy_tag }}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ github.ref_name }}-${{ github.sha }},enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.deploy_tag }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend-recommend
          file: ./backend-recommend/Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}

  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: self-hosted

    steps:
      - name: Deploy to Swarm
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MANAGER_IP }}
          username: kevin
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/deploy

            export BACKEND_IMAGE="${{ needs.build-push.outputs.backend_image }}:${{ needs.build-push.outputs.deploy_tag }}"
            export FRONTEND_IMAGE="${{ needs.build-push.outputs.frontend_image }}:${{ needs.build-push.outputs.deploy_tag }}"

            docker pull "$BACKEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"

            BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
            docker stack deploy --with-registry-auth -c swarm-compose.yml paw

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MANAGER_IP }}
          username: kevin
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker service ls
            docker service ps paw_backend-dashboard --no-trunc || true
            docker service ps paw_frontend --no-trunc || true
