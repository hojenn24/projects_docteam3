name: CI-CD Docker Swarm Deploy

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          echo "📁 Repository structure:"
          ls -la

          echo ""
          echo "📁 backend-recommend contents:"
          ls -la backend-recommend/ || echo "❌ backend-recommend not found"

          echo ""
          echo "📁 frontend contents:"
          ls -la frontend/ || echo "❌ frontend not found"

          echo ""
          echo "🔍 Dockerfile check:"
          find . -name "Dockerfile" -type f

      # HTTP Harbor Registry 허용
      - name: Configure insecure Harbor registry
        run: |
          if ! grep -q "192.168.0.215:5000" /etc/docker/daemon.json 2>/dev/null; then
            echo '{
              "insecure-registries": ["192.168.0.215:5000"]
            }' | sudo tee /etc/docker/daemon.json

            sudo systemctl restart docker
          fi

          until docker info >/dev/null 2>&1; do
            sleep 1
          done

      - name: Debug Harbor secrets
        run: |
          if [ -z "${{ secrets.HARBOR_USER }}" ]; then
            echo "❌ HARBOR_USER is EMPTY"
          else
            echo "✅ HARBOR_USER exists"
          fi

          if [ -z "${{ secrets.HARBOR_PASSWORD }}" ]; then
            echo "❌ HARBOR_PASSWORD is EMPTY"
          else
            echo "✅ HARBOR_PASSWORD exists"
          fi

          echo "HARBOR_URL=${{ secrets.HARBOR_URL }}"

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login 192.168.0.215:5000 \
            -u "${{ secrets.HARBOR_USER }}" \
            --password-stdin

      - name: Build backend image
        run: |
          echo "🚀 Building backend image..."

          docker build \
            -f ./backend-recommend/Dockerfile \
            -t 192.168.0.215:5000/pawdata/backend:3.1 \
            ./backend-recommend

      - name: Build frontend image
        run: |
          echo "🚀 Building frontend image..."

          docker build \
            -f ./frontend/Dockerfile \
            -t 192.168.0.215:5000/pawdata/frontend:2.0 \
            ./frontend

      - name: Push backend image
        run: |
          echo "📤 Pushing backend image..."
          docker push 192.168.0.215:5000/pawdata/backend:3.1

      - name: Push frontend image
        run: |
          echo "📤 Pushing frontend image..."
          docker push 192.168.0.215:5000/pawdata/frontend:2.0

      - name: Deploy to Swarm (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MANAGER_IP }}
          username: kevin
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/deploy

            echo "🚀 Deploying stack to Swarm..."

            docker service ls || echo "No services found"

            docker pull 192.168.0.215:5000/pawdata/backend:3.1
            docker pull 192.168.0.215:5000/pawdata/frontend:2.0

            docker stack deploy \
              --with-registry-auth \
              -c swarm-compose.yml paw

            docker service ls

      - name: Verify deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MANAGER_IP }}
          username: kevin
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "🔍 Checking service status..."

            docker service ls || echo "No services"

            docker service ps paw_backend-dashboard --no-trunc || echo "Backend service not found"

            docker service ps paw_frontend --no-trunc || echo "Frontend service not found"
