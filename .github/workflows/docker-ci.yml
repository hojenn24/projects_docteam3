name: CI-CD Docker Swarm Deploy

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. 코드 가져오기 + 구조 확인 (NEW)
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          echo "📁 Repository structure:"
          ls -la
          echo ""
          echo "📁 backend-recommend contents:"
          ls -la backend-recommend/ || echo "❌ backend-recommend not found"
          echo ""
          echo "📁 frontend contents:"
          ls -la frontend/ || echo "❌ frontend not found"
          echo ""
          echo "🔍 Dockerfile check:"
          find . -name "Dockerfile" -type f

      # =========================
      # 2. Docker build (수정됨)
      # =========================
      - name: Build backend image
        run: |
          echo "🚀 Building backend from backend-recommend/"
          docker build -t 192.168.0.215/pawdata/backend:3.1 ./backend-recommend

      - name: Build frontend image  
        run: |
          echo "🚀 Building frontend from frontend/"
          docker build -t 192.168.0.215/pawdata/frontend:2.0 ./frontend

      # =========================
      # 3. Registry push
      # =========================
      - name: Login to Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login 192.168.0.215:5000 -u ${{ secrets.REGISTRY_USER }} --password-stdin

      - name: Push backend image
        run: |
          docker push 192.168.0.215/pawdata/backend:3.1

      - name: Push frontend image
        run: |
          docker push 192.168.0.215/pawdata/frontend:2.0

      # =========================
      # 4. Swarm 배포
      # =========================
      - name: Deploy to Swarm (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MANAGER_IP }}
          username: kevin
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/deploy

            echo "🚀 Deploying stack to Swarm..."
            echo "📦 Current services:"
            docker service ls 2>/dev/null || echo "No services found"

            docker stack deploy \
              --with-registry-auth \
              -c swarm-compose.yml paw

            echo "✅ Deploy completed"
            echo "📦 Services after deploy:"
            docker service ls

      # =========================
      # 5. 배포 검증
      # =========================
      - name: Verify deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MANAGER_IP }}
          username: kevin
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "🔍 Checking service status..."
            docker service ls || echo "No services"
            echo ""
            echo "🔍 Backend service details:"
            docker service ps paw_backend-dashboard --no-trunc || echo "Service not found"
            echo ""
            echo "🔍 Frontend service details:"  
            docker service ps paw_frontend --no-trunc || echo "Service not found"
