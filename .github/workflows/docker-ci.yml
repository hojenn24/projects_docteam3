name: Docker CI/CDuild

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKERHUB_USERNAME: limseongin
  BACKEND_IMAGE: limseongin/paw-backend
  FRONTEND_IMAGE: limseongin/paw-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show GitHub workspace
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          echo "===== ROOT FILES ====="
          ls -al
          echo "===== FILE TREE ====="
          find . -maxdepth 3 -type f | sort
          echo "===== DOCKERFILES ====="
          find . -iname "Dockerfile" -o -iname "*.dockerfile" | sort

      - name: Stop here for debug
        run: |
          echo "Workspace check completed."
          echo "Now inspect the log and find the real backend/frontend paths."

      check-secrets:
      runs-on: ubuntu-latest
      outputs:
        has_username: ${{ steps.check.outputs.has_username }}
        has_token: ${{ steps.check.outputs.has_token }}
  
      steps:
        - name: Check Docker Hub secrets
          id: check
          env:
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
            DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          run: |
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "has_username=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_username=false" >> "$GITHUB_OUTPUT"
            fi
  
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "has_token=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_token=false" >> "$GITHUB_OUTPUT"
            fi


  push-and-deploy:
    if: github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.check-secrets.outputs.has_username == 'true' &&
        needs.check-secrets.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    needs: [test-build, check-secrets]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy paused until real paths are confirmed
        run: |
          echo "Docker Hub login succeeded."
          echo "Build/push/deploy steps are intentionally paused."
          echo "First confirm the actual Dockerfile paths from test-build logs."

      - name: Build backend image
        run: docker build -t $BACKEND_IMAGE:$IMAGE_TAG -t $BACKEND_IMAGE:latest ./backend

      - name: Build frontend image
        run: docker build -t $FRONTEND_IMAGE:$IMAGE_TAG -t $FRONTEND_IMAGE:latest ./frontend

      - name: Push backend image tags
        run: |
          docker push $BACKEND_IMAGE:$IMAGE_TAG
          docker push $BACKEND_IMAGE:latest

      - name: Push frontend image tags
        run: |
          docker push $FRONTEND_IMAGE:$IMAGE_TAG
          docker push $FRONTEND_IMAGE:latest

      - name: Verify pushed images exist
        run: |
          docker pull $BACKEND_IMAGE:$IMAGE_TAG
          docker pull $FRONTEND_IMAGE:$IMAGE_TAG

      - name: Create network
        run: docker network create app-network || true

      - name: Run MongoDB
        run: |
          docker run -d \
            --name mongo \
            --network app-network \
            -p 27017:27017 \
            mongo:7

      - name: Wait for MongoDB
        run: |
          for i in {1..20}; do
            docker exec mongo mongosh --eval "db.runCommand({ ping: 1 })" && exit 0
            echo "mongo not ready yet... retry $i"
            sleep 2
          done
          echo "mongo failed"
          docker logs mongo || true
          exit 1

      - name: Run backend container
        run: |
          docker run -d \
            --name backend \
            --network app-network \
            -p 8000:8000 \
            -e MONGO_HOST=mongo \
            -e MONGO_PORT=27017 \
            -e MONGO_DB=pet_data \
            $BACKEND_IMAGE:$IMAGE_TAG

      - name: Backend logs
        run: |
          sleep 5
          docker logs backend

      - name: Wait backend startup
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:8000/api/facilities && exit 0
            echo "backend not ready yet... retry $i"
            sleep 3
          done
          echo "backend failed"
          docker logs backend || true
          exit 1

      - name: Run frontend container
        run: |
          docker run -d \
            --name frontend \
            --network app-network \
            -p 8080:80 \
            $FRONTEND_IMAGE:$IMAGE_TAG

      - name: Frontend check
        run: |
          for i in {1..20}; do
            curl -fsS http://localhost:8080 && exit 0
            echo "frontend not ready yet... retry $i"
            sleep 3
          done
          echo "frontend failed"
          docker logs frontend || true
          exit 1

      - name: Docker status
        run: docker ps -a

      - name: Cleanup
        if: always()
        run: |
          docker stop backend frontend mongo || true
          docker rm backend frontend mongo || true
          docker network rm app-network || true









