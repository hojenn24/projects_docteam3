name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Docker 이미지 pull
      - name: Pull backend image
        run: docker pull limseongin/paw-backend:3.0

      - name: Pull frontend image
        run: docker pull limseongin/paw-frontend:2.0

      # 3. MongoDB 실행 (🔥 핵심 추가)
      - name: Run MongoDB
        run: |
          docker run -d \
            --name mongo \
            -p 27017:27017 \
            mongo:7

      # 4. Backend 실행 (Mongo 연결 포함)
      - name: Run backend container
        run: |
          docker run -d \
            --name backend \
            -p 8000:8000 \
            --env MONGO_HOST=host.docker.internal \
            --env MONGO_PORT=27017 \
            --env MONGO_DB=pet_data \
            limseongin/paw-backend:3.0

      # 5. Frontend 실행
      - name: Run frontend container
        run: |
          docker run -d \
            --name frontend \
            -p 8080:80 \
            limseongin/paw-frontend:2.0

      # 6. 상태 확인 (디버깅 핵심)
      - name: Check containers
        run: docker ps -a

      - name: Backend logs
        run: docker logs backend || true

      - name: Mongo logs
        run: docker logs mongo || true

      # 7. 서버 대기
      - name: Wait for services
        run: sleep 15

      # 8. Backend health check
      - name: Test backend health (retry)
        run: |
          for i in {1..15}; do
            curl -f http://localhost:8000/api/health && exit 0
            echo "backend not ready yet... retry $i"
            sleep 3
          done
          exit 1

      # 9. Frontend health check
      - name: Test frontend health (retry)
        run: |
          for i in {1..15}; do
            curl -f http://localhost:8080 && exit 0
            echo "frontend not ready yet... retry $i"
            sleep 3
          done
          exit 1

      # 10. 정리
      - name: Stop containers
        if: always()
        run: |
          docker stop backend frontend mongo || true
          docker rm backend frontend mongo || true
