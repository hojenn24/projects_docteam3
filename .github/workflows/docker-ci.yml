name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 이미지 pull
      - name: Pull backend image
        run: docker pull limseongin/paw-backend:3.0

      - name: Pull frontend image
        run: docker pull limseongin/paw-frontend:2.0

      # 3. Docker 네트워크 생성 (🔥 중요)
      - name: Create network
        run: docker network create app-network

      # 4. MongoDB 실행 (같은 네트워크)
      - name: Run MongoDB
        run: |
          docker run -d \
            --name mongo \
            --network app-network \
            -p 27017:27017 \
            mongo:7

      # 5. Backend 실행 (network 기반 연결)
      - name: Run backend container
        run: |
          docker run -d \
            --name backend \
            --network app-network \
            -p 8000:8000 \
            -e MONGO_HOST=mongo \
            -e MONGO_PORT=27017 \
            -e MONGO_DB=pet_data \
            limseongin/paw-backend:3.0

      # 6. Frontend 실행
      - name: Run frontend container
        run: |
          docker run -d \
            --name frontend \
            -p 8080:80 \
            limseongin/paw-frontend:2.0

      # 7. 상태 확인
      - name: Check containers
        run: docker ps -a

      - name: Backend logs
        run: docker logs backend || true

      - name: Mongo logs
        run: docker logs mongo || true

      # 8. 서비스 대기
      - name: Wait for services
        run: sleep 20

      # 9. Backend health check (핵심 수정)
      - name: Test backend health (retry)
        run: |
          for i in {1..20}; do
            curl -f http://localhost:8000/api/facilities && exit 0
            echo "backend not ready yet... retry $i"
            sleep 3
          done
          echo "backend failed"
          exit 1

      # 10. Frontend health check
      - name: Test frontend health (retry)
        run: |
          for i in {1..20}; do
            curl -f http://localhost:8080 && exit 0
            echo "frontend not ready yet... retry $i"
            sleep 3
          done
          echo "frontend failed"
          exit 1

      # 11. 정리
      - name: Stop containers
        if: always()
        run: |
          docker stop backend frontend mongo || true
          docker rm backend frontend mongo || true
          docker network rm app-network || true
