name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 이미지 pull
      - name: Pull backend image
        run: docker pull limseongin/paw-backend:3.0

      - name: Pull frontend image
        run: docker pull limseongin/paw-frontend:2.0

      # 2. 컨테이너 실행
      - name: Run backend container
        run: |
          docker run -d --name backend -p 3000:8000 limseongin/paw-backend:3.0

      - name: Run frontend container
        run: |
          docker run -d --name frontend -p 8080:80 limseongin/paw-frontend:2.0

      # 🔥 3. 상태 확인 (여기부터 중요)
      - name: Check container status (IMPORTANT)
        run: |
          docker ps -a
          echo "---- backend inspect ----"
          docker inspect backend || true

      # 🔥 4. 로그 확인 (여기가 핵심 원인)
      - name: Backend logs (CHECK THIS FIRST)
        run: |
          echo "===== BACKEND LOG START ====="
          docker logs backend || true
          echo "===== BACKEND LOG END ====="

      - name: Frontend logs
        run: |
          echo "===== FRONTEND LOG START ====="
          docker logs frontend || true
          echo "===== FRONTEND LOG END ====="

      # 5. 서버 대기
      - name: Wait for services
        run: sleep 10

      # 6. backend 테스트
      - name: Test backend health (retry)
        run: |
          for i in {1..15}; do
            curl -v http://localhost:3000 && exit 0
            echo "backend not ready yet... retry $i"
            sleep 3
          done
          exit 1

      # 7. frontend 테스트
      - name: Test frontend health (retry)
        run: |
          for i in {1..15}; do
            curl -v http://localhost:8080 && exit 0
            echo "frontend not ready yet... retry $i"
            sleep 3
          done
          exit 1

      # 8. 정리
      - name: Stop containers
        if: always()
        run: |
          docker stop backend frontend || true
          docker rm backend frontend || true
