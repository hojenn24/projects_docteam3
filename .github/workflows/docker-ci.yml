name: CI-CD Docker Swarm Deploy

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. 코드 가져오기 + 구조 확인
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          echo "📁 Repository structure:"
          ls -la

          echo ""
          echo "📁 backend-recommend contents:"
          ls -la backend-recommend/ || echo "❌ backend-recommend not found"

          echo ""
          echo "📁 frontend contents:"
          ls -la frontend/ || echo "❌ frontend not found"

          echo ""
          echo "🔍 Dockerfile check:"
          find . -name "Dockerfile" -type f

      # =========================
      # 2. Docker build
      # =========================
      - name: Build backend image
        run: |
          echo "🚀 Building backend image..."
      
          docker build \
          -f ./frontend/Dockerfile \
          -t 192.168.0.215:5000/pawdata/frontend:2.0 \
          ./frontend

      - name: Build frontend image
        run: |
          echo "🚀 Building frontend image..."
          docker build \
            -f ./frontend/Dockerfile \
            -t 192.168.0.215:5000/pawdata/frontend:2.0 \
            ./frontend

      # =========================
      # 3. Registry login + push
      # =========================
      - name: Login to Harbor
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login 192.168.0.215:5000 \
            -u "${{ secrets.REGISTRY_USER }}" \
            --password-stdin

      - name: Push backend image
        run: |
          echo "📤 Pushing backend image..."
          docker push 192.168.0.215:5000/pawdata/backend:3.1

      - name: Push frontend image
        run: |
          echo "📤 Pushing frontend image..."
          docker push 192.168.0.215:5000/pawdata/frontend:2.0

      # =========================
      # 4. Docker Swarm 배포
      # =========================
      - name: Deploy to Swarm (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MANAGER_IP }}
          username: kevin
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/deploy

            echo "🚀 Deploying stack to Swarm..."

            echo ""
            echo "📦 Current services:"
            docker service ls || echo "No services found"

            echo ""
            echo "📥 Pulling latest images..."
            docker pull 192.168.0.215:5000/pawdata/backend:3.1
            docker pull 192.168.0.215:5000/pawdata/frontend:2.0

            echo ""
            echo "🚀 Deploy stack..."
            docker stack deploy \
              --with-registry-auth \
              -c swarm-compose.yml paw

            echo ""
            echo "✅ Deploy completed"

            echo ""
            echo "📦 Services after deploy:"
            docker service ls

      # =========================
      # 5. 배포 검증
      # =========================
      - name: Verify deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MANAGER_IP }}
          username: kevin
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "🔍 Checking service status..."

            echo ""
            docker service ls || echo "No services"

            echo ""
            echo "🔍 Backend service details:"
            docker service ps paw_backend-dashboard --no-trunc || echo "Backend service not found"

            echo ""
            echo "🔍 Frontend service details:"
            docker service ps paw_frontend --no-trunc || echo "Frontend service not found"

            echo ""
            
            echo "🔍 All files inside backend-recommend:"
            find ./backend-recommend
            
            echo ""
            echo "🔍 All files inside frontend:"
            find ./frontend
