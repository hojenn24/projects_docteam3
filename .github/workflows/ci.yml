name: CI-CD Docker Swarm Deploy

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. 코드 가져오기
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # 2. Docker build (핵심 변경)
      # =========================
      - name: Build backend image
        run: |
          docker build -t 192.168.0.215/pawdata/backend:3.1 ./backend

      - name: Build frontend image
        run: |
          docker build -t 192.168.0.215/pawdata/frontend:2.0 ./frontend

      # =========================
      # 3. Registry push (Harbor or private registry)
      # =========================
      - name: Login to Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login 192.168.0.215:5000 -u ${{ secrets.REGISTRY_USER }} --password-stdin

      - name: Push backend image
        run: |
          docker push 192.168.0.215/pawdata/backend:3.1

      - name: Push frontend image
        run: |
          docker push 192.168.0.215/pawdata/frontend:2.0

      # =========================
      # 4. Swarm 배포 (핵심)
      # =========================
      - name: Deploy to Swarm (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MANAGER_IP }}
          username: kevin
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/deploy

            echo "🚀 Deploying stack to Swarm..."

            docker stack deploy \
              --with-registry-auth \
              -c swarm-compose.yml paw

            echo "📦 Services after deploy:"
            docker service ls

      # =========================
      # 5. 배포 검증 (옵션)
      # =========================
      - name: Verify deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MANAGER_IP }}
          username: kevin
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker service ps paw_backend-dashboard
            docker service ps paw_frontend
